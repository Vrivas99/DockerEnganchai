name: Build and Push Docker Images

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server/flask/**'
      - 'server/express/**'
      - 'client/**'
      - 'server/flask/Dockerfile'
      - 'server/express/Dockerfile'
      - 'client/Dockerfile'

jobs:

  Change-checker:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.paths.outputs.client }}
      express: ${{ steps.paths.outputs.express }}
      flask: ${{ steps.paths.outputs.flask }}
      oracle: ${{ steps.paths.outputs.oracle }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Detect changed folders
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'client/**'
            express:
              - 'server/express/**'
            flask:
              - 'server/flask/**'
            oracle:
              - 'db-scripts/**'

  build-flask:
    name: Build & Push Flask
    needs: [filter]
    if: needs.filter.outputs.flask == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, push tmp and promote
        run: |
          REMOTE_LATEST="vicenterivas/enganchai:flask-latest"
          REMOTE_OLD="vicenterivas/enganchai:flask-old"
          TMP_TAG="vicenterivas/enganchai:flask-tmp"

          # Pull old latest (si existe) para cache
          docker pull $REMOTE_LATEST || true
          OLD_ID=$(docker images -q $REMOTE_LATEST || echo "")

          # Construye imagen Flask → TMP, push TMP
          docker build \
            --cache-from=$REMOTE_LATEST \
            -f server/flask/Dockerfile \
            -t $TMP_TAG \
            server/flask
          docker push $TMP_TAG

          # Si el push TMP funcionó, promueve tags
          if [ $? -eq 0 ]; then
            docker tag $TMP_TAG $REMOTE_LATEST
            docker push $REMOTE_LATEST

            # Si había un latest previo, taguéalo a “-old” y push
            if [ -n "$OLD_ID" ]; then
              docker tag $REMOTE_LATEST $REMOTE_OLD
              docker push $REMOTE_OLD
            fi
          else
            echo "❌ Flask tmp build/push failed — no se tocan latest/old tags."
            exit 1
          fi

  build-express:
    name: Build & Push Express
    needs: [filter]
    if: needs.filter.outputs.express == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Express deps
        uses: actions/cache@v3
        with:
          path: server/express/node_modules
          key: ${{ runner.os }}-express-${{ hashFiles('server/express/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-express-

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, push tmp and promote
        run: |
          REMOTE_LATEST="vicenterivas/enganchai:express-latest"
          REMOTE_OLD="vicenterivas/enganchai:express-old"
          TMP_TAG="vicenterivas/enganchai:express-tmp"

          # Pull old latest (si existe) para cache
          docker pull $REMOTE_LATEST || true
          OLD_ID=$(docker images -q $REMOTE_LATEST || echo "")

          # Construye imagen Express → TMP, push TMP
          docker build \
            --cache-from=$REMOTE_LATEST \
            -f server/express/Dockerfile \
            -t $TMP_TAG \
            server/express
          docker push $TMP_TAG

          # Si el push TMP funcionó, promueve tags
          if [ $? -eq 0 ]; then
            docker tag $TMP_TAG $REMOTE_LATEST
            docker push $REMOTE_LATEST

            # Si había un latest previo, taguéalo a “-old” y push
            if [ -n "$OLD_ID" ]; then
              docker tag $REMOTE_LATEST $REMOTE_OLD
              docker push $REMOTE_OLD
            fi
          else
            echo "❌ Express tmp build/push failed — no se tocan latest/old tags."
            exit 1
          fi

  build-client:
    name: Build & Push Client
    needs: [filter]
    if: needs.filter.outputs.client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Client deps
        uses: actions/cache@v3
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-client-

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, push tmp and promote
        run: |
          REMOTE_LATEST="vicenterivas/enganchai:client-latest"
          REMOTE_OLD="vicenterivas/enganchai:client-old"
          TMP_TAG="vicenterivas/enganchai:client-tmp"

          # Pull old latest (si existe) para cache
          docker pull $REMOTE_LATEST || true
          OLD_ID=$(docker images -q $REMOTE_LATEST || echo "")

          # Construye imagen Client → TMP, push TMP
          docker build \
            --cache-from=$REMOTE_LATEST \
            -f client/Dockerfile \
            -t $TMP_TAG \
            client
          docker push $TMP_TAG

          # Si el push TMP funcionó, promueve tags
          if [ $? -eq 0 ]; then
            docker tag $TMP_TAG $REMOTE_LATEST
            docker push $REMOTE_LATEST

            # Si había un latest previo, taguéalo a “-old” y push
            if [ -n "$OLD_ID" ]; then
              docker tag $REMOTE_LATEST $REMOTE_OLD
              docker push $REMOTE_OLD
            fi
          else
            echo "❌ Client tmp build/push failed — no se tocan latest/old tags."
            exit 1
          fi

  build-oracle-db:
    name: Build & Push Oracle DB
    needs: [filter]
    if: needs.filter.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v2

      - name: Pull, tag and push Oracle DB image
        run: |
          # Definimos nuestros tags en Docker Hub
          REMOTE_LATEST="vicenterivas/enganchai:oracle-db-latest"
          REMOTE_OLD="vicenterivas/enganchai:oracle-db-old"
          TMP_TAG="vicenterivas/enganchai:oracle-db-tmp"

          # Hacemos pull del posible latest existente (cache)
          docker pull $REMOTE_LATEST || true
          OLD_ID=$(docker images -q $REMOTE_LATEST || echo "")

          # Pull de la imagen oficial de Oracle DB 21c
          docker pull gvenzl/oracle-xe:21-slim-faststart

          # Tagueamos como TMP y lo subimos
          docker tag gvenzl/oracle-xe:21-slim-faststart $TMP_TAG
          docker push $TMP_TAG

          # Si el push TMP funcionó, promovemos tags
          if [ $? -eq 0 ]; then
            docker tag $TMP_TAG $REMOTE_LATEST
            docker push $REMOTE_LATEST

            # Si existía un latest previo, lo renombramos a “-old” y lo subimos
            if [ -n "$OLD_ID" ]; then
              docker tag $REMOTE_LATEST $REMOTE_OLD
              docker push $REMOTE_OLD
            fi
          else
            echo "❌ Oracle DB tmp push failed — no se tocan latest/old tags."
            exit 1
          fi

  cleanup-old:
    name: Delete tags ending with -old
    needs: [build-flask, build-express, build-client, build-oracle-db]
    runs-on: ubuntu-latest
    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Fetch Docker Hub JWT token
        id: get_token
        run: |
          # Obtenemos un token JWT para la API de Docker Hub
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST https://hub.docker.com/v2/users/login/ \
            -d "{\"username\":\"${{ secrets.DOCKER_USERNAME }}\",\"password\":\"${{ secrets.DOCKER_PASSWORD }}\"}" \
            | jq -r .token)

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "❌ Error: no se pudo obtener token de Docker Hub."
            exit 1
          fi

          echo "::set-output name=token::$TOKEN"

      - name: List and delete tags ending in -old
        env:
          REPO: "vicenterivas/enganchai"      # <— Reemplaza con tu repositorio real en Docker Hub
          TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          # 1) Listar hasta 100 tags, filtrar los que terminen en "-old"
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$REPO/tags?page_size=100" \
            | jq -r '.results[].name | select(test("-old$"))')

          if [ -z "$TAGS" ]; then
            echo "ℹ️ No se encontraron tags que terminen en -old."
            exit 0
          fi

          # 2) Iterar sobre cada tag encontrado y borrarlo vía API
          for tag in $TAGS; do
            echo "🗑️ Eliminando tag: $tag"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REPO/tags/$tag/")

            if [ "$HTTP_STATUS" -eq 204 ]; then
              echo "✅ Tag eliminado: $tag"
            else
              echo "❌ Falló al eliminar $tag (HTTP status: $HTTP_STATUS)"
            fi
          done