name: Build and Push Docker Images

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server/flask/**'
      - 'server/express/**'
      - 'client/**'
      - 'server/flask/Dockerfile'
      - 'server/express/Dockerfile'
      - 'client/Dockerfile'

jobs:
  build-flask:
    name: Build & Push Flask (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define tags
        run: |
          echo "REMOTE_LATEST=vicenterivas/enganchai:flask-latest" >> $GITHUB_ENV
          echo "REMOTE_OLD=vicenterivas/enganchai:flask-old"       >> $GITHUB_ENV
          echo "TMP_TAG=vicenterivas/enganchai:flask-tmp"         >> $GITHUB_ENV

      - name: Pull cache
        run: |
          docker pull $REMOTE_LATEST || true

      - name: Build & push Flask tmp
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=$REMOTE_LATEST \
            --cache-to type=inline \
            --file server/flask/Dockerfile \
            --tag $TMP_TAG \
            --push \
            server/flask

      - name: Promote Flask tmp → latest & rotate old
        run: |
          # Promote multi-arch manifest to latest
          docker buildx imagetools create --tag $REMOTE_LATEST $TMP_TAG

          # Rotate old
          if docker manifest inspect $REMOTE_OLD >/dev/null 2>&1; then
            docker pull $REMOTE_LATEST
            docker tag $REMOTE_LATEST $REMOTE_OLD
            docker push $REMOTE_OLD
          fi

  build-express:
    name: Build & Push Express (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Express deps
        uses: actions/cache@v3
        with:
          path: server/express/node_modules
          key: ${{ runner.os }}-express-${{ hashFiles('server/express/package-lock.json') }}
          restore-keys: ${{ runner.os }}-express-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define tags
        run: |
          echo "REMOTE_LATEST=vicenterivas/enganchai:express-latest" >> $GITHUB_ENV
          echo "REMOTE_OLD=vicenterivas/enganchai:express-old"       >> $GITHUB_ENV
          echo "TMP_TAG=vicenterivas/enganchai:express-tmp"         >> $GITHUB_ENV

      - name: Pull cache
        run: |
          docker pull $REMOTE_LATEST || true

      - name: Build & push Express tmp
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=$REMOTE_LATEST \
            --cache-to type=inline \
            --file server/express/Dockerfile \
            --tag $TMP_TAG \
            --push \
            server/express

      - name: Promote Express tmp → latest & rotate old
        run: |
          docker buildx imagetools create --tag $REMOTE_LATEST $TMP_TAG
          if docker manifest inspect $REMOTE_OLD >/dev/null 2>&1; then
            docker pull $REMOTE_LATEST
            docker tag $REMOTE_LATEST $REMOTE_OLD
            docker push $REMOTE_OLD
          fi

  build-client:
    name: Build & Push Client (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Client deps
        uses: actions/cache@v3
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-${{ hashFiles('client/package-lock.json') }}
          restore-keys: ${{ runner.os }}-client-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define tags
        run: |
          echo "REMOTE_LATEST=vicenterivas/enganchai:client-latest" >> $GITHUB_ENV
          echo "REMOTE_OLD=vicenterivas/enganchai:client-old"       >> $GITHUB_ENV
          echo "TMP_TAG=vicenterivas/enganchai:client-tmp"         >> $GITHUB_ENV

      - name: Pull cache
        run: |
          docker pull $REMOTE_LATEST || true

      - name: Build & push Client tmp
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=registry,ref=$REMOTE_LATEST \
            --cache-to type=inline \
            --file client/Dockerfile \
            --tag $TMP_TAG \
            --push \
            client

      - name: Promote Client tmp → latest & rotate old
        run: |
          docker buildx imagetools create --tag $REMOTE_LATEST $TMP_TAG
          if docker manifest inspect $REMOTE_OLD >/dev/null 2>&1; then
            docker pull $REMOTE_LATEST
            docker tag $REMOTE_LATEST $REMOTE_OLD
            docker push $REMOTE_OLD
          fi

  build-oracle-db:
    name: Push Oracle DB Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull official Oracle XE
        run: docker pull gvenzl/oracle-xe:21-slim-faststart

      - name: Tag & Push Oracle DB
        run: |
          docker tag gvenzl/oracle-xe:21-slim-faststart vicenterivas/enganchai:oracle-db-latest
          docker push vicenterivas/enganchai:oracle-db-latest

  cleanup-old:
    name: Delete tags ending with -old
    needs: [build-flask, build-express, build-client, build-oracle-db]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Fetch Docker Hub JWT token
        id: get_token
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST https://hub.docker.com/v2/users/login/ \
            -d "{\"username\":\"${{ secrets.DOCKER_USERNAME }}\",\"password\":\"${{ secrets.DOCKER_PASSWORD }}\"}" \
            | jq -r .token)
          echo "::set-output name=token::$TOKEN"

      - name: Delete tags ending in -old
        env:
          REPO: "vicenterivas/enganchai"
          TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$REPO/tags?page_size=100" \
            | jq -r '.results[].name | select(test("-old$"))')
          for tag in $TAGS; do
            echo "Deleting $tag"
            curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REPO/tags/$tag/"
          done
