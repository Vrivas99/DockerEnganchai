name: Build & Push Docker Images

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1) Detectar qué carpetas cambiaron
  filter:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.paths.outputs.client }}
      express: ${{ steps.paths.outputs.express }}
      flask: ${{ steps.paths.outputs.flask }}
      oracle: ${{ steps.paths.outputs.oracle }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Detect changed folders
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters:
            client:
              - 'client/**'
            express:
              - 'server/express/**'
            flask:
              - 'server/flask/**'
            oracle:
              - 'db-scripts/**'

  # 2) Matrix build para Client / Express / Flask
  build-services:
    needs: filter
    runs-on: ubuntu-latest
    if: |
      needs.filter.outputs.client == 'true' ||
      needs.filter.outputs.express == 'true' ||
      needs.filter.outputs.flask == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            context: client
            dockerfile: client/Dockerfile
            tmpTag: vicenterivas/enganchai:client-tmp
            latestTag: vicenterivas/enganchai:client-latest
            oldTag:   vicenterivas/enganchai:client-old
            changed:  ${{ needs.filter.outputs.client }}
          - name: express
            context: server/express
            dockerfile: server/express/Dockerfile
            tmpTag: vicenterivas/enganchai:express-tmp
            latestTag: vicenterivas/enganchai:express-latest
            oldTag:   vicenterivas/enganchai:express-old
            changed:  ${{ needs.filter.outputs.express }}
          - name: flask
            context: server/flask
            dockerfile: server/flask/Dockerfile
            tmpTag: vicenterivas/enganchai:flask-tmp
            latestTag: vicenterivas/enganchai:flask-latest
            oldTag:   vicenterivas/enganchai:flask-old
            changed:  ${{ needs.filter.outputs.flask }}
    # Solo ejecutar el paso si realmente cambió
    if: matrix.changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure tmp tag exists
        run: |
          echo "⏳ Verificando existencia de ${{ matrix.tmpTag }}…"
          if ! docker pull ${{ matrix.tmpTag }}; then
            echo "⚠️ ${matrix.tmpTag} no existe; recreando desde ${matrix.latestTag}"
            docker pull ${matrix.latestTag} || { echo "❌ ${matrix.latestTag} no existe"; exit 1; }
            docker tag ${matrix.latestTag} ${matrix.tmpTag}
            docker push ${matrix.tmpTag}
          fi

      - name: Build & push multi-arch → tmp
        run: |
          echo "🔨 Building multi-arch ${matrix.name} → ${matrix.tmpTag}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from=type=registry,ref=${{ matrix.latestTag }} \
            --cache-to=type=inline \
            --file=${{ matrix.dockerfile }} \
            --tag=${{ matrix.tmpTag }} \
            --push \
            ${{ matrix.context }}

      - name: Promote tmp → latest & rotate old
        run: |
          TMP=${{ matrix.tmpTag }}
          LATEST=${{ matrix.latestTag }}
          OLD=${{ matrix.oldTag }}

          echo "📦 Clonando manifest de $TMP a $LATEST"
          docker buildx imagetools create --tag $LATEST $TMP

          # Si existía un latest anterior, pásalo a old
          if docker manifest inspect $LATEST >/dev/null 2>&1; then
            echo "🔄 Rotando $LATEST → $OLD"
            docker pull $LATEST
            docker tag $LATEST $OLD
            docker push $OLD
          fi

  # 3) Oracle DB (imagen oficial reetiquetada)
  build-oracle-db:
    needs: filter
    if: needs.filter.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull & re-tag Oracle XE
        run: |
          REMOTE_LATEST="vicenterivas/enganchai:oracle-db-latest"
          REMOTE_OLD="vicenterivas/enganchai:oracle-db-old"
          TMP_TAG="vicenterivas/enganchai:oracle-db-tmp"

          docker pull gvenzl/oracle-xe:21-slim-faststart

          echo "🏷️ Etiquetando tmp → $TMP_TAG"
          docker tag gvenzl/oracle-xe:21-slim-faststart $TMP_TAG
          docker push $TMP_TAG

          echo "📦 Clonando manifiesto tmp → latest"
          docker buildx imagetools create --tag $REMOTE_LATEST $TMP_TAG

          # Rotar a old
          if docker manifest inspect $REMOTE_LATEST >/dev/null 2>&1; then
            docker pull $REMOTE_LATEST
            docker tag $REMOTE_LATEST $REMOTE_OLD
            docker push $REMOTE_OLD
          fi

  # 4) Limpieza de tags *-old
  cleanup-old:
    name: Delete tags ending with -old
    needs: [build-services, build-oracle-db]
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Fetch Docker Hub JWT token
        id: get_token
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST https://hub.docker.com/v2/users/login/ \
            -d "{\"username\":\"${{ secrets.DOCKER_USERNAME }}\",\"password\":\"${{ secrets.DOCKER_PASSWORD }}\"}" \
            | jq -r .token)
          echo "::set-output name=token::$TOKEN"

      - name: Delete "-old" tags
        env:
          REPO: "vicenterivas/enganchai"
          TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          echo "🗑️ Buscando tags '*-old' en $REPO"
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$REPO/tags?page_size=100" \
            | jq -r '.results[].name | select(test("-old$"))')

          for tag in $TAGS; do
            echo "  → Eliminando $tag"
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REPO/tags/$tag/")
            echo "    Status: $HTTP"
          done
