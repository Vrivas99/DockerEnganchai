name: Build and Push Docker Images

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - 'server/flask/**'
      - 'server/express/**'
      - 'client/**'
      - 'server/flask/Dockerfile'
      - 'server/express/Dockerfile'
      - 'client/Dockerfile'
      - 'server/flask/requirements.txt'
      - 'server/express/package-lock.json'
      - 'client/package-lock.json'
      - 'yarn.lock'

jobs:
  build-flask:
    name: Build & Push Flask
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, push tmp and promote
        run: |
          REMOTE_LATEST="vicenterivas/enganchai:flask-latest"
          REMOTE_OLD="vicenterivas/enganchai:flask-old"
          TMP_TAG="vicenterivas/enganchai:flask-tmp"

          # Pull old latest (if exists) to enable cache
          docker pull $REMOTE_LATEST || true
          OLD_ID=$(docker images -q $REMOTE_LATEST || echo "")

          # Build to tmp and push it
          docker build \
            --cache-from=$REMOTE_LATEST \
            -f server/flask/Dockerfile \
            -t $TMP_TAG \
            server/flask

          docker push $TMP_TAG

          # If push succeeded, promote tags
          if [ $? -eq 0 ]; then
            # Tag tmp → latest and push
            docker tag $TMP_TAG $REMOTE_LATEST
            docker push $REMOTE_LATEST

            # Only if there was a previous latest, tag it → old and push
            if [ -n "$OLD_ID" ]; then
              docker tag $REMOTE_LATEST $REMOTE_OLD
              docker push $REMOTE_OLD
            fi
          else
            echo "❌ Flask tmp build/push failed — no se tocan latest/old tags."
            exit 1
          fi

          # Cleanup local tmp
          docker rmi $TMP_TAG

  build-express:
    name: Build & Push Express
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Express deps
        uses: actions/cache@v3
        with:
          path: server/express/node_modules
          key: ${{ runner.os }}-express-deps-${{ hashFiles('server/express/package-lock.json') }}
          restore-keys: ${{ runner.os }}-express-deps-

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, push tmp and promote
        run: |
          REMOTE_LATEST="vicenterivas/enganchai:express-latest"
          REMOTE_OLD="vicenterivas/enganchai:express-old"
          TMP_TAG="vicenterivas/enganchai:express-tmp"

          docker pull $REMOTE_LATEST || true
          OLD_ID=$(docker images -q $REMOTE_LATEST || echo "")

          docker build \
            --cache-from=$REMOTE_LATEST \
            -f server/express/Dockerfile \
            -t $TMP_TAG \
            server/express

          docker push $TMP_TAG

          if [ $? -eq 0 ]; then
            docker tag $TMP_TAG $REMOTE_LATEST
            docker push $REMOTE_LATEST

            if [ -n "$OLD_ID" ]; then
              docker tag $REMOTE_LATEST $REMOTE_OLD
              docker push $REMOTE_OLD
            fi
          else
            echo "❌ Express tmp build/push failed — no se tocan latest/old tags."
            exit 1
          fi

          docker rmi $TMP_TAG

  build-client:
    name: Build & Push Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cache Client deps
        uses: actions/cache@v3
        with:
          path: client/node_modules
          key: ${{ runner.os }}-client-deps-${{ hashFiles('client/package-lock.json') }}
          restore-keys: ${{ runner.os }}-client-deps-

      - name: Set up QEMU & Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, push tmp and promote
        run: |
          REMOTE_LATEST="vicenterivas/enganchai:client-latest"
          REMOTE_OLD="vicenterivas/enganchai:client-old"
          TMP_TAG="vicenterivas/enganchai:client-tmp"

          docker pull $REMOTE_LATEST || true
          OLD_ID=$(docker images -q $REMOTE_LATEST || echo "")

          docker build \
            --cache-from=$REMOTE_LATEST \
            -f client/Dockerfile \
            -t $TMP_TAG \
            client

          docker push $TMP_TAG

          if [ $? -eq 0 ]; then
            docker tag $TMP_TAG $REMOTE_LATEST
            docker push $REMOTE_LATEST

            if [ -n "$OLD_ID" ]; then
              docker tag $REMOTE_LATEST $REMOTE_OLD
              docker push $REMOTE_OLD
            fi
          else
            echo "❌ Client tmp build/push failed — no se tocan latest/old tags."
            exit 1
          fi

          docker rmi $TMP_TAG

  cleanup:
    name: Cleanup Old Tags
    needs: [build-flask, build-express, build-client]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Delete all *-old tags
        env:
          REPO: "vicenterivas/enganchai"
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST https://hub.docker.com/v2/users/login/ \
            -d "{\"username\":\"${{ secrets.DOCKER_USERNAME }}\",\"password\":\"${{ secrets.DOCKER_PASSWORD }}\"}" \
            | jq -r .token)

          # Elimina todos los tags que terminen en -old
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$REPO/tags?page_size=100" \
            | jq -r '.results[].name | select(test("-old$"))')

          for tag in $TAGS; do
            echo "Deleting old tag: $tag"
            curl -s -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REPO/tags/$tag/"
          done
